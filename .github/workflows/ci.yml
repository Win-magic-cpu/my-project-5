name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest -q

      - name: 离线评估（阈值 0.90）
        run: uv run python eval/run_eval.py --min-accuracy 0.90
